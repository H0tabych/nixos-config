name: secrets

on:
  push:
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # ПРОВЕРИТЬ: свериться с github.com/DeterminateSystems/nix-installer-action/releases
      - uses: DeterminateSystems/nix-installer-action@v21

      - name: gitleaks (код и история, A3)
        run: nix develop --command bash scripts/check-secrets.sh
