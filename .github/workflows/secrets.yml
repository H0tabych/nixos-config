name: secrets

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: DeterminateSystems/nix-installer-action@v23

      - name: gitleaks (код и история, A3)
        run: nix develop --command bash scripts/check-secrets.sh
