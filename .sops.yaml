# Recipients только публичные (SEC-7). Добавление хоста или пользователя
# меняет этот файл (STR-10). Плейсхолдеры — заменить реальными публичными
# ключами перед первым `just sops-edit`:
#   <ключ-sgm>          — публичный age-ключ пользователя sgm (age-keygen,
#                          гибридный PQ — если поддерживает версия age/sops)
#   <ключ-sgms-laptop>  — публичный SSH host ed25519-ключ хоста sgms-laptop,
#                          конвертированный ssh-to-age
creation_rules:
  - path_regex: secrets/common\.yaml$
    key_groups:
      - age:
          - 
          - age12lxmd4lhjlwe5cem0zwwceqmgax4dpc3fwpc4ga67fy5enpvjuhsmpknwg
  - path_regex: secrets/hosts/sgms-laptop\.yaml$
    key_groups:
      - age:
          - 
          - age12lxmd4lhjlwe5cem0zwwceqmgax4dpc3fwpc4ga67fy5enpvjuhsmpknwg
  - path_regex: secrets/users/sgm\.yaml$
    key_groups:
      # Те же два получателя: у sgm один хост, собственного отдельного
      # получателя-хоста для него не требуется (STR-10, SEC-7).
      - age:
          - 
          - age12lxmd4lhjlwe5cem0zwwceqmgax4dpc3fwpc4ga67fy5enpvjuhsmpknwg
